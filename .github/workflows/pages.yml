name: Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAVEN_OPTS: "-Xmx2048m"
  MAVEN_CLI_OPTS: "-B -ntp -e"

jobs:
  build:
    permissions: { contents: read, id-token: write, pages: write }
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: maven

      - name: Build site (develop)
        run: mvn ${MAVEN_CLI_OPTS} -Ppitest clean verify site site:stage-deploy

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: { path: "./target/site-staging/staging" }

      - name: Deploy to Pages
        uses: actions/deploy-pages@v5
