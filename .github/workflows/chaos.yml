name: Chaos Tests

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: chaos
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx2048m"
  MAVEN_CLI_OPTS: "-B -ntp -e"

jobs:
  chaos:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      - name: Chaos / resilience tests
        run: mvn ${MAVEN_CLI_OPTS} -Pchaos -pl bootstrap -am test
