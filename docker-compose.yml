x-restart: &restart-policy
  restart: unless-stopped

x-resources: &default-resources
  <<: *restart-policy
  deploy:
    resources:
      limits: { cpus: "1", memory: "512M" }
      reservations: { cpus: "0.25", memory: "256M" }

services:
  mongodb:
    image: mongodb/mongodb-community-server:8.3.4-ubi9
    container_name: product-sorter-mongodb
    hostname: mongodb
    restart: unless-stopped
    ports: ["27017:27017"]
    networks: [product-sorter]
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "2", memory: "2048M" }
        reservations: { cpus: "1", memory: "1024M" }

  redis:
    image: redis:8-alpine
    container_name: product-sorter-redis
    hostname: redis
    restart: unless-stopped
    ports: ["6379:6379"]
    networks: [product-sorter]
    command: redis-server --save 20 1 --loglevel warning --requirepass admin
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "2", memory: "2048M" }
        reservations: { cpus: "1", memory: "1024M" }

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: product-sorter-redisinsight
    hostname: redisinsight
    restart: unless-stopped
    ports: ["5540:5540"]
    networks: [product-sorter]
    environment:
      RI_REDIS_HOST_0: redis
      RI_REDIS_PORT_0: 6379
      RI_REDIS_ALIAS_0: REDIS_LOCAL
      RI_REDIS_USERNAME_0: ${REDIS_USERNAME:-default}
      RI_REDIS_PASSWORD_0: ${REDIS_PASSWORD:-admin}
    <<: *restart-policy

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: product-sorter-keycloak
    restart: unless-stopped
    ports: ["8081:8080"]
    networks: [product-sorter]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: false
    command: ["start-dev","--import-realm"]
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    deploy:
      resources:
        limits: { cpus: "2", memory: "2048M" }
        reservations: { cpus: "1", memory: "1024M" }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0-nightly.286fff0
    container_name: product-sorter-otel
    restart: unless-stopped
    ports: ["4318:4318"]
    networks: [product-sorter]
    volumes:
      - ./docker/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on: [tempo]
    <<: *default-resources

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: product-sorter-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    networks: [product-sorter]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [otel-collector]
    <<: *default-resources

  tempo:
    image: grafana/tempo:3.0.2
    container_name: product-sorter-tempo
    restart: unless-stopped
    ports: ["3200:3200"]
    networks: [product-sorter]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/tempo.yml:/etc/tempo/tempo.yml:ro
    <<: *default-resources

  loki:
    image: grafana/loki:3.7.3
    container_name: product-sorter-loki
    restart: unless-stopped
    ports: ["3100:3100"]
    networks: [product-sorter]
    volumes:
      - ./docker/loki-config.yml:/etc/loki/local-config.yml:ro
    <<: *default-resources

  promtail:
    image: grafana/promtail:3.6.11
    container_name: product-sorter-promtail
    restart: unless-stopped
    networks: [product-sorter]
    volumes:
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    <<: *default-resources

  grafana:
    image: grafana/grafana:13.1.0
    container_name: product-sorter-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    networks: [product-sorter]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on: [prometheus, tempo, loki]
    <<: *default-resources

  product-sorter-app:
    build: .
    container_name: product-sorter-app
    hostname: product-sorter-app
    restart: unless-stopped
    ports: ["8880:8880"]
    networks: [product-sorter]
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: docker-compose
      SPRING_DOCKER_COMPOSE_ENABLED: false
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1500m -XX:+UseContainerSupport -XX:+UseCompactObjectHeaders -Djava.security.egd=file:/dev/./urandom"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/productsorter}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-admin}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://keycloak:8080/realms/product-sorter/protocol/openid-connect/certs}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      LOG_PATH: /var/log/product-sorter
      LOGGING_LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "2", memory: "2048M" }
        reservations: { cpus: "1", memory: "1024M" }

volumes:
  mongodb_data:

networks:
  product-sorter:
    name: product-sorter-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
