x-resources: &default-resources
  deploy:
    resources:
      limits: { cpus: "1", memory: "512M" }
      reservations: { cpus: "0.25", memory: "256M" }

services:
  mongodb:
    image: mongodb/mongodb-community-server:8.3.2-ubi9
    container_name: product-sorter-mongodb
    hostname: mongodb
    ports: ["27017:27017"]
    networks: [product-sorter]
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "2", memory: "2048M" }
        reservations: { cpus: "1", memory: "1024M" }

  redis:
    image: redis:8-alpine
    container_name: product-sorter-redis
    hostname: redis
    ports: ["6379:6379"]
    networks: [product-sorter]
    command: redis-server --save 20 1 --loglevel warning --requirepass admin
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "2", memory: "2048M" }
        reservations: { cpus: "1", memory: "1024M" }

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: product-sorter-redisinsight
    hostname: redisinsight
    ports: ["5540:5540"]
    networks: [product-sorter]
    environment:
      RI_REDIS_HOST_0: redis
      RI_REDIS_PORT_0: 6379
      RI_REDIS_ALIAS_0: REDIS_LOCAL
      RI_REDIS_USERNAME_0: default
      RI_REDIS_PASSWORD_0: admin
    <<: *default-resources

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: product-sorter-keycloak
    ports: ["8081:8080"]
    networks: [product-sorter]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://keycloak:8080
      KC_HOSTNAME_STRICT: false
      KC_PROXY: edge
    command: ["start-dev","--import-realm"]
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    deploy:
      resources:
        limits: { cpus: "2", memory: "2048M" }
        reservations: { cpus: "1", memory: "1024M" }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0-nightly.286fff0
    container_name: product-sorter-otel
    ports: ["4318:4318"]
    networks: [product-sorter]
    volumes:
      - ./docker/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on: [tempo]
    <<: *default-resources

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: product-sorter-prometheus
    ports: ["9090:9090"]
    networks: [product-sorter]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [otel-collector]
    <<: *default-resources

  tempo:
    image: grafana/tempo:3.0.2
    container_name: product-sorter-tempo
    ports: ["3200:3200"]
    networks: [product-sorter]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/tempo.yml:/etc/tempo/tempo.yml:ro
    <<: *default-resources

  loki:
    image: grafana/loki:3.7.2
    container_name: product-sorter-loki
    ports: ["3100:3100"]
    networks: [product-sorter]
    volumes:
      - ./docker/loki-config.yml:/etc/loki/local-config.yml:ro
    <<: *default-resources

  promtail:
    image: grafana/promtail:3.6.11
    container_name: product-sorter-promtail
    networks: [product-sorter]
    volumes:
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    <<: *default-resources

  grafana:
    image: grafana/grafana:13.0.2
    container_name: product-sorter-grafana
    ports: ["3000:3000"]
    networks: [product-sorter]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on: [prometheus, tempo, loki]
    <<: *default-resources

volumes:
  mongodb_data:

networks:
  product-sorter:
    name: product-sorter-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
