cache:
  redis:
    enabled: true
    ttl: 300

resilience:
  retry:
    max-attempts: 2
    initial-backoff-millis: 20
  circuitbreaker:
    failure-rate-threshold: 50
    slow-call-rate-threshold: 100
    slow-call-duration-seconds: 2
    sliding-window-size: 10
    minimum-number-of-calls: 3
    wait-open-seconds: 2
  bulkhead:
    max-concurrent-calls: 64
    max-wait-millis: 50

logging:
  level:
    dev.jpje.productsorter: INFO
