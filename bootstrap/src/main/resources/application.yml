spring:
  application:
    name: product-sorter
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/productsorter}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/product-sorter}
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: app
      use-pkce-with-authorization-code-grant: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

server:
  application-display-name: application
  port: ${PORT:8880}

logging:
  level:
    root: WARN
    com.acidtango.productsorter: INFO

---

spring:
  config:
    activate:
      on-profile: "docker"
  data:
    mongodb:
      uri: mongodb://mongodb:27017/productsorter
    redis:
      host: redis
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/product-sorter

cache:
  redis:
    enabled: true

management:
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces

---

spring:
  config:
    activate:
      on-profile: "docker-compose"
  docker:
    compose:
      enabled: true
      lifecycle-management: start_and_stop
      file: docker-compose.yml
