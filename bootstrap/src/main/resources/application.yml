spring:
  application:
    name: product-sorter
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  mongodb:
    uri: "${MONGODB_URI:mongodb://localhost:27017/productsorter?maxPoolSize=200&connectTimeoutMS=120000&timeoutMS=120000&serverSelectionTimeoutMS=90000}"
    ssl:
      enabled: false
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/product-sorter}
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: app
      use-pkce-with-authorization-code-grant: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

server:
  application-display-name: application
  port: ${PORT:8880}

logging:
  level:
    root: WARN
    com.acidtango.productsorter: INFO
    org.springframework.boot: INFO

---

spring:
  config:
    activate:
      on-profile: "docker"
  mongodb:
    uri: "${MONGODB_URI:mongodb://mongodb:27017/productsorter?maxPoolSize=200&connectTimeoutMS=120000&timeoutMS=120000&serverSelectionTimeoutMS=90000}"
  data:
    redis:
      host: redis
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://keycloak:8080/realms/product-sorter}

cache:
  redis:
    enabled: true

---

spring:
  config:
    activate:
      on-profile: "docker-compose"
  docker:
    compose:
      enabled: true
      lifecycle-management: start_and_stop
      readiness:
        tcp-ports: 4318,27017,8081
      file: docker-compose.yml
      skip:
        in-tests: true
      start:
        command: up
        arguments: --quiet-pull
        skip: if_running
        log-level: trace
      stop:
        command: down
