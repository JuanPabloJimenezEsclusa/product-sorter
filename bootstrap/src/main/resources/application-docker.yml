cache:
  redis:
    enabled: true

spring:
  data:
    mongodb:
      uri: mongodb://mongodb:27017/productsorter
    redis:
      host: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/product-sorter

management:
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
